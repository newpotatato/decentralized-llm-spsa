name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routing_test
          POSTGRES_PASSWORD: routing_test
          POSTGRES_DB: routing_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U routing_test -d routing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # CPU-only torch keeps the install small; the tests do not need a GPU.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider tests
        env:
          # No secrets in CI; the tests use stub clients and never call a provider.
          LLM_MAX_CALLS: "0"
          TEST_ROUTING_DATABASE_URL: postgresql://routing_test:routing_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/routing_test
